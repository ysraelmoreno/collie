# Lint, module boundaries, build and the test suite (minus scripts/ci/ci-skip.txt), on every pull request and push to main.
# No secrets and read-only token: safe to run on pull requests from forks.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # run the suite on any branch on demand (gh workflow run ci.yml --ref <branch>), without opening a pull request
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push to the same PR supersedes the old run; main runs are never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # macos-26 = macOS 26 arm64 with Xcode 26 (swift-tools 6.2), same runner as release.yml
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint
        run: scripts/ci/lint.sh

      - name: Arquitetura
        run: scripts/ci/check-architecture.sh

      - name: Testes dos scripts de CI
        run: |
          scripts/ci/test-check-architecture.sh
          scripts/ci/test-lint.sh
          scripts/ci/test-run-tests.sh

      - name: Versão do Swift
        id: swift
        run: echo "version=$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p' | head -1)" >> "$GITHUB_OUTPUT"

      # only this test build's .build: a cold build cost 6-9 min every run. release.yml stays cold (signed build)
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: build-${{ runner.os }}-swift${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: build-${{ runner.os }}-swift${{ steps.swift.outputs.version }}-

      - name: Build
        run: swift build --build-tests

      # VizinhoPluginTests runs the real plug-in binary: .build/plugins/vizinho/bin/vizinho (never committed; a release build
      # of one small product). Without this step that test skips itself ("plug-in do Vizinho não construído")
      - name: Plug-in do Vizinho
        run: scripts/build-vizinho-plugin.sh

      # not a bare `swift test`: its exit code is the test process's, which went green after exiting 0 mid-run, and
      # all tests at once starve a 3-core runner. run-tests.sh: serial shards, each checked by its final test count and
      # under CI_SHARD_TIMEOUT (900 s): a hang fails naming the last test started instead of waiting for cancellation
      - name: Testes
        run: scripts/ci/run-tests.sh
        env:
          OUT: ${{ runner.temp }}/tests

      - name: Logs dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ${{ runner.temp }}/tests
          retention-days: 7
