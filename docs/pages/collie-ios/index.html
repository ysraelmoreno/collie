<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collie iOS</title>
<link rel="stylesheet" href="collie-lib://fonts/css?family=Space%20Grotesk&family=DM%20Mono">
<style>
/* Tokens = Sources/CollieTheme/Palette.swift (dark é o padrão do app; light em [data-theme=light]) */
:root {
  --background:#0E1326; --surface:#161C36; --sidebar:#121831; --sunken:#0B1020; --raised:#1B2340;
  --border:#262E52; --border-soft:#1E2647; --grid:#151B33; --scrim:#070A16;
  --text:#E8ECF8; --text2:#B6BEDB; --muted:#8C95B8;
  --accent:#6EE7B7; --on-accent:#0E1326; --attention:#FFB86B; --attention-tint:#2A2418;
  --secondary:#93A4FF; --danger:#FF8A8A; --mark:#6E9BFF;
  --r-btn:9px; --r-field:10px; --r-card:14px; --r-tag:6px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --background:#F3F4F1; --surface:#FFFFFF; --sidebar:#ECEDE9; --sunken:#F7F7F5; --raised:#E3E7F7;
  --border:#D9DBD5; --border-soft:#E4E5E0; --grid:#E4E5E0; --scrim:#C9CBC5;
  --text:#15171C; --text2:#2E323B; --muted:#5C6270;
  --accent:#2448C9; --on-accent:#FFFFFF; --attention:#A14A06; --attention-tint:#FDF6EE;
  --secondary:#6B3FC4; --danger:#B42318; --mark:#2F6BFF;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --background:#F3F4F1; --surface:#FFFFFF; --sidebar:#ECEDE9; --sunken:#F7F7F5; --raised:#E3E7F7;
    --border:#D9DBD5; --border-soft:#E4E5E0; --grid:#E4E5E0; --scrim:#C9CBC5;
    --text:#15171C; --text2:#2E323B; --muted:#5C6270;
    --accent:#2448C9; --on-accent:#FFFFFF; --attention:#A14A06; --attention-tint:#FDF6EE;
    --secondary:#6B3FC4; --danger:#B42318; --mark:#2F6BFF;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--sidebar); color: var(--text); font: 15px/1.4 "Space Grotesk", system-ui, -apple-system, sans-serif; min-height: 100vh; }
.mono, code, pre { font-family: "DM Mono", ui-monospace, Menlo, monospace; }
button { font: inherit; color: inherit; cursor: pointer; }
.lucide { width: 1.1em; height: 1.1em; vertical-align: -0.15em; stroke-width: 2; }

/* Stage: índice de telas + iPhone */
.stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 28px 16px 48px; }
.index { width: 248px; position: sticky; top: 20px; }
.index h1 { font-size: 18px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
.index p { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
.index h3 { font: 500 11px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.index button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 8px; color: var(--text2); font-size: 13px; }
.index button:hover { background: var(--raised); }
.index button.on { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
.notes { margin-top: 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; }
.notes b { color: var(--text2); font-weight: 500; }
@media (max-width: 760px) { .stage { flex-direction: column; align-items: center; } .index { width: 100%; max-width: 390px; position: static; } }

.device { width: 390px; height: 844px; border-radius: 54px; padding: 12px; background: #05070F; box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 0 0 2px #2a2f44; flex: none; max-width: 100%; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--background); display: flex; flex-direction: column; }
.status { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; font-weight: 600; font-size: 15px; position: relative; z-index: 5; }
.island { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; background: #000; border-radius: 20px; transform: translateX(-50%); }
.status .sys { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; border-radius: 3px; background: var(--text); opacity: .5; transform: translateX(-50%); z-index: 9; }

/* App chrome */
.nav { flex: none; padding: 4px 18px 10px; display: flex; align-items: center; gap: 10px; }
.nav h2 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.01em; flex: 1; }
.nav .back { background: none; border: 0; color: var(--accent); display: flex; align-items: center; gap: 2px; padding: 4px 0; font-size: 16px; }
.nav.small h2 { font-size: 17px; font-weight: 600; text-align: center; }
.iconbtn { width: 36px; height: 36px; border-radius: 18px; border: 0; background: var(--surface); display: grid; place-items: center; color: var(--text2); box-shadow: inset 0 0 0 1px var(--border); }
.body { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
.body::-webkit-scrollbar { display: none; }
.tabs { flex: none; display: flex; border-top: 1px solid var(--border); background: var(--sidebar); padding: 6px 4px 26px; }
.tabs button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); position: relative; padding: 4px 0; }
.tabs button .lucide { width: 24px; height: 24px; }
.tabs button.on { color: var(--accent); }
.badge { position: absolute; top: 0; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--attention); color: var(--background); font: 600 11px/18px "DM Mono", monospace; text-align: center; padding: 0 5px; }

.section { font: 500 11px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; display: flex; align-items: center; gap: 6px; }
.section .sp { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); }
.card.att { border-color: color-mix(in srgb, var(--attention) 60%, transparent); }
.list > * + * { border-top: 1px solid var(--border-soft); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: 0; width: 100%; text-align: left; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 5px; flex: none; }
.dot.run { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); animation: pulse 1.6s infinite; }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
.dot.att { background: var(--attention); box-shadow: 0 0 0 4px color-mix(in srgb, var(--attention) 22%, transparent); }
.dot.dead { background: var(--danger); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } }
.tag { font: 500 11px "DM Mono", monospace; padding: 2px 6px; border-radius: var(--r-tag); border: 1px solid color-mix(in srgb, currentColor 50%, transparent); white-space: nowrap; }
.tag.accent { color: var(--accent); } .tag.att { color: var(--attention); } .tag.sec { color: var(--secondary); } .tag.danger { color: var(--danger); } .tag.neutral { color: var(--muted); }
.avatar { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--raised); color: var(--text2); flex: none; font: 600 12px "DM Mono", monospace; }
.avatar.pastor { background: color-mix(in srgb, var(--secondary) 22%, var(--surface)); color: var(--secondary); }

.btn { border: 0; border-radius: var(--r-btn); height: 40px; padding: 0 14px; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.att { background: var(--attention); color: var(--background); }
.btn.sec { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 45%, transparent); }
.btn.quiet { background: transparent; color: var(--muted); }
.btn.block { width: 100%; height: 48px; font-size: 16px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btns { display: flex; gap: 8px; } .btns > * { flex: 1; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 13px; margin: 0 0 6px; }
.banner.att { background: var(--attention-tint); color: var(--attention); border: 1px solid color-mix(in srgb, var(--attention) 40%, transparent); }
.banner.danger { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.banner .lucide { flex: none; margin-top: 2px; }
.banner b { display: block; color: var(--text); font-weight: 600; }

.term { background: var(--sunken); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: 12px/1.55 "DM Mono", monospace; color: var(--text2); white-space: pre-wrap; word-break: break-word; }
.term .p { color: var(--accent); } .term .m { color: var(--muted); } .term .a { color: var(--attention); } .term .s { color: var(--secondary); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 5px 11px; font-size: 12.5px; color: var(--text2); }
.composer { flex: none; border-top: 1px solid var(--border); background: var(--sidebar); padding: 8px 12px 30px; }
.composer .f { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; height: 40px; border-radius: 20px; border: 1px solid var(--border); background: var(--sunken); color: var(--text); font: 14px/1.3 "Space Grotesk", sans-serif; padding: 10px 14px; outline: none; }
.composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.composer .send { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.composer .hint { font-size: 11.5px; color: var(--muted); margin: 6px 4px 0; }
.bubble { margin: 10px 0 0 40px; background: var(--raised); border-radius: 14px 14px 4px 14px; padding: 8px 12px; font-size: 14px; }
.bubble .meta { font: 11px "DM Mono", monospace; color: var(--muted); margin-top: 4px; }
.reply { margin: 10px 40px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: 13.5px; }
.reply.collie { color: var(--muted); font-size: 13px; }
.reply .meta { font: 11px "DM Mono", monospace; color: var(--muted); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }

.approval { padding: 14px; }
.approval + .approval { margin-top: 10px; }
.approval .hd { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.approval .hd .t { font-weight: 600; } .approval .hd .s { font-size: 12px; color: var(--muted); }
.approval .q { font-size: 14px; margin: 0 0 10px; }
.approval .q code { background: var(--sunken); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; word-break: break-all; }
.approval .cap { font: 11.5px/1.5 "DM Mono", monospace; background: var(--sunken); border-radius: 8px; padding: 8px 10px; color: var(--text2); margin-bottom: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
.approval .opt { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); margin: -2px 0 12px; }
.approval .opt input { accent-color: var(--accent); }
.seg { display: flex; background: var(--sunken); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 0; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--border); }

.empty { text-align: center; padding: 70px 24px 20px; color: var(--muted); }
.empty .ill { width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 28px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--text2); }
.empty .ill .lucide { width: 38px; height: 38px; stroke-width: 1.5; }
.empty h4 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
.empty p { margin: 0 auto 18px; max-width: 280px; font-size: 14px; }

.task { display: flex; gap: 10px; padding: 9px 14px; align-items: flex-start; font-size: 14px; }
.task .lucide { margin-top: 2px; flex: none; }
.task .why { display: block; font-size: 12px; color: var(--muted); }
.task.done { color: var(--muted); } .task.done span:first-of-type { text-decoration: line-through; }
.kv { display: flex; gap: 6px; flex-wrap: wrap; }
.progress { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; margin: 10px 0 2px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.thumb { aspect-ratio: 4/3; border-radius: 10px; background: var(--sunken); border: 1px solid var(--border-soft); overflow: hidden; position: relative; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pcard { background: none; border: 0; padding: 0; text-align: left; }
.pcard .t { font-weight: 600; font-size: 13.5px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .s { font-size: 11.5px; color: var(--muted); }
.mini { position: absolute; inset: 0; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
.mini i { display: block; height: 6px; border-radius: 3px; background: var(--border); }

.qrwrap { margin: 10px auto 0; width: 280px; height: 280px; border-radius: 28px; position: relative; background: #000; overflow: hidden; }
.qrwrap .cam { position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, #2a3150, #0b0e18 70%); }
.qrwrap .corner { position: absolute; width: 46px; height: 46px; border: 4px solid var(--accent); }
.qrwrap .c1 { top: 36px; left: 36px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.qrwrap .c2 { top: 36px; right: 36px; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
.qrwrap .c3 { bottom: 36px; left: 36px; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
.qrwrap .c4 { bottom: 36px; right: 36px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.qrwrap svg { position: absolute; left: 70px; top: 70px; width: 140px; height: 140px; opacity: .9; }
.scanline { position: absolute; left: 50px; right: 50px; height: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: scan 2.2s ease-in-out infinite; top: 60px; }
@keyframes scan { 50% { top: 216px; } }
.code6 { display: flex; gap: 8px; justify-content: center; margin: 18px 0 8px; }
.code6 span { width: 42px; height: 54px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; font: 500 26px "DM Mono", monospace; }
.center { text-align: center; }
.lead { color: var(--muted); font-size: 14.5px; margin: 6px 8px 0; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 18px 0; }
.steps li { counter-increment: s; display: flex; gap: 12px; padding: 8px 0; font-size: 14px; color: var(--text2); }
.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 12px; background: var(--raised); color: var(--text); font: 500 12px/24px "DM Mono", monospace; text-align: center; }

/* Lock screen / pushes */
.lock { position: absolute; inset: 0; background: linear-gradient(160deg, #1a2350 0%, #0b1020 55%, #0f2a2a 100%); color: #fff; padding: 64px 12px 0; }
.lock .clock { text-align: center; font-size: 82px; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.lock .date { text-align: center; font-size: 18px; opacity: .85; margin-bottom: 38px; }
.push { background: rgba(255,255,255,.14); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 20px; padding: 11px 13px; margin-bottom: 8px; color: #fff; font-size: 14px; width: 100%; text-align: left; border: 0; display: block; }
.push .ph { display: flex; align-items: center; gap: 8px; font-size: 12.5px; opacity: .85; margin-bottom: 3px; }
.push .ph .ic { width: 20px; height: 20px; border-radius: 5px; background: #0E1326; display: grid; place-items: center; }
.push .ph .tm { margin-left: auto; }
.push b { display: block; font-weight: 600; }
.push .acts { display: flex; gap: 6px; margin-top: 10px; }
.push .acts span { flex: 1; text-align: center; background: rgba(255,255,255,.18); border-radius: 12px; padding: 8px; font-size: 13.5px; font-weight: 500; }
.push.expanded { background: rgba(255,255,255,.2); }

.toast { position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 20; background: var(--text); color: var(--background); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; transform: translateY(20px); opacity: 0; transition: .25s; pointer-events: none; }
.toast.show { transform: none; opacity: 1; }
.sheetwrap { position: absolute; inset: 0; z-index: 30; background: color-mix(in srgb, var(--scrim) 60%, transparent); display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 18px 36px; border-top: 1px solid var(--border); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 14px; }
.faceid { text-align: center; padding: 18px 0 8px; }
.faceid .lucide { width: 56px; height: 56px; color: var(--accent); stroke-width: 1.4; }
.settings .row .lucide { color: var(--muted); }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--accent); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; }
.switch.off { background: var(--border); } .switch.off::after { right: auto; left: 3px; }
.stale { opacity: .5; filter: saturate(.3); pointer-events: none; }
.frame-prev { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #F4F2ED; color: #15171C; }
.frame-prev .ph { padding: 14px; }
.frame-prev h5 { margin: 0 0 6px; font-size: 17px; }
.frame-prev p { margin: 0 0 8px; font-size: 12px; color: #5A5D66; }
.frame-prev .bar { height: 8px; border-radius: 4px; background: #DCD8CF; margin: 6px 0; }
.frame-prev .hero { height: 90px; background: linear-gradient(135deg, #2D69FD, #6EE7B7); border-radius: 8px; margin: 8px 0; }
.frame-prev.dark { background: #15171C; color: #F4F2ED; } .frame-prev.dark p { color: #8C95B8; } .frame-prev.dark .bar { background: #2E323B; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

V.lock = (expanded) => `<div class="lock">${statusBar(true).replace('<span>9:41</span>', '<span></span>')}<div class="clock">9:41</div><div class="date">quarta-feira, 4 de novembro</div>
  <button class="push ${expanded ? 'expanded' : ''}" data-go="${expanded ? 'term-att' : 'lock-expanded'}"><div class="ph"><span class="ic"><svg width="14" height="14" viewBox="0 0 200 200"><path d="M145.3 54.7 A64 64 0 1 0 145.3 145.3" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/><circle cx="145.3" cy="54.7" r="20" fill="#6E9BFF"/></svg></span>COLLIE<span class="tm">agora</span></div>
    <b>net-panel pede aprovação</b>Bash: swift test --filter NetworkPanelTests
    ${expanded ? `<div class="acts"><span>Negar</span><span>Aprovar (Face ID)</span><span>Abrir</span></div>` : ''}</button>
  ${expanded ? '' : `<div class="push"><div class="ph"><span class="ic">${I('shield', 'style="width:12px;height:12px;color:#fff"')}</span>COLLIE<span class="tm">há 6 min</span></div><b>cursor-spike bloqueado pelo sandbox</b>Tentou escrever ~/.cursor/mcp.json. Toque para decidir.</div>
  <div class="push"><div class="ph"><span class="ic">${I('circle-check', 'style="width:12px;height:12px;color:#6EE7B7"')}</span>COLLIE<span class="tm">09:12</span></div><b>Trabalho fechado por merge</b>summon sem preset herda o do Pastor · d388635</div>
  <div class="push"><div class="ph"><span class="ic">${I('circle-help', 'style="width:12px;height:12px;color:#FFB86B"')}</span>COLLIE<span class="tm">08:40</span></div><b>net-panel: job sem sinal há 30 min</b>swift build · pode ter travado</div>
  <div class="push" style="opacity:.75"><div class="ph"><span class="ic">${I('wifi-off', 'style="width:12px;height:12px;color:#FF8A8A"')}</span>COLLIE<span class="tm">ontem</span></div><b>Mac sem contato há 10 min</b>3 terminais estavam rodando. Avisamos quando voltar.</div>`}
  <p style="text-align:center;font-size:12px;opacity:.6;margin-top:14px">${expanded ? 'Pressão longa: Aprovar pede Face ID; cartões do sandbox só dentro do app.' : 'Toque no primeiro para ver as ações'}</p></div>`;

V.settings = () => {
  const sw = (on) => `<span class="switch ${on ? '' : 'off'}"></span>`;

    <div class="section">Notificações</div><div class="card list">
      ${[['Aprovações de comando', 1], ['Cartões do sandbox', 1], ['Trabalho fechado', 1], ['Job sem sinal / terminal encerrado', 1], ['Mac sem contato', 0], ['Saída na tela de bloqueio', 0]].map(([l, on]) => `<div class="row"><div class="main"><div class="t" style="font-weight:500">${l}</div>${l.startsWith('Saída') ? '<div class="s">Desligado: o push mostra só o nome do terminal</div>' : ''}</div>${sw(on)}</div>`).join('')}</div>
    <div class="section">Segurança</div><div class="card list">
      <div class="row">${I('scan-face')}<div class="main"><div class="t" style="font-weight:500">Face ID para Aprovar e Liberar</div></div>${sw(true)}</div>
      <div class="row">${I('timer')}<div class="main"><div class="t" style="font-weight:500">Bloquear o app após</div></div><span style="color:var(--muted)">5 min</span></div></div>
    <button class="btn danger block" style="margin-top:20px" data-go="pair-welcome">Desparear este iPhone</button>
    <p style="font-size:11.5px;color:var(--muted);text-align:center">Também revogável no Mac, em Ajustes › iPhone.</p></div>${tabs()}`;
};

// ---------- Folhas ----------
function sheet() {
  if (!S.sheet) return '';
  const [kind, arg] = S.sheet.split(':');
  let inner = '';
  if (kind === 'faceid') inner = `<div class="faceid">${I('scan-face')}<h3 style="margin:10px 0 4px">Liberar com Face ID</h3><p style="color:var(--muted);font-size:14px;margin:0 0 6px">Escrita em <span class="mono">~/.cursor/mcp.json</span> para <b>cursor-spike</b>. O terminal reinicia.</p></div>
    <div class="btns"><button class="btn sec" data-act="sheet:">Cancelar</button><button class="btn primary" data-act="decide:${arg}:ok">Confirmar</button></div>`;
  if (kind === 'stale') inner = `<div class="faceid">${I('clock-alert', 'style="color:var(--attention)"')}<h3 style="margin:10px 0 4px">Pedido não está mais pendente</h3><p style="color:var(--muted);font-size:14px;margin:0 0 6px">A tela do terminal mudou (alguém respondeu no Mac, ou o agente seguiu). Nada foi digitado.</p></div>
    <div class="btns"><button class="btn sec" data-act="sheet:">Ok</button><button class="btn primary" data-term="net">Ver terminal</button></div>`;
  if (kind === 'rerail') inner = `<h3 style="margin:0 0 6px">Recolocar no trilho?</h3><p style="color:var(--muted);font-size:14px;margin:0 0 14px">Injeta no agente só o estado vivo: tarefas abertas, jobs rodando e as 5 decisões mais recentes (até 2000 caracteres). Recusado se houver aprovação pendente.</p>
    <div class="btns"><button class="btn sec" data-act="sheet:">Cancelar</button><button class="btn primary" data-act="toast:Recolocado no trilho">Recolocar</button></div>`;
  if (kind === 'termmenu' || kind === 'workmenu' || kind === 'share') inner = `<div class="card list">${(kind === 'share' ? [['laptop', 'Abrir no Mac'], ['copy', 'Copiar caminho'], ['download', 'Exportar PDF (no Mac)']] : kind === 'workmenu' ? [['route', 'Recolocar no trilho'], ['archive', 'Fechar trabalho…'], ['square-terminal', 'Abrir terminal']] : [['zap', 'Onde estamos'], ['route', 'Recolocar no trilho'], ['laptop', 'Mostrar no canvas do Mac'], ['bell-off', 'Silenciar este terminal']]).map(([i, l]) => `<button class="row" data-act="toast:${l}">${I(i)}<div class="main"><div class="t" style="font-weight:500">${l}</div></div></button>`).join('')}</div>
    <button class="btn quiet block" data-act="sheet:" style="margin-top:8px">Cancelar</button>`;
  return `<div class="sheetwrap" data-act="sheet:"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>${inner}</div></div>`;
}

// ---------- Render / eventos ----------
const scr = document.getElementById('screen'), idx = document.getElementById('index');
function qrSvg() { let s = '<svg viewBox="0 0 21 21" aria-hidden="true"><rect width="21" height="21" fill="#fff"/>'; let seed = 7;
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) { seed = (seed * 9301 + 49297) % 233280; const fin = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const on = fin ? ((x % 14 === 0 || x % 14 === 6 || y % 14 === 0 || y % 14 === 6 || (x % 14 > 1 && x % 14 < 5 && y % 14 > 1 && y % 14 < 5)) && !(x % 14 === 0 && false)) : seed / 233280 > .55; if (on) s += `<rect x="${x}" y="${y}" width="1" height="1" fill="#0E1326"/>`; }
  return s + '</svg>'; }
function renderIndex() {
  idx.innerHTML = `<h1><svg width="22" height="22" viewBox="0 0 200 200"><path d="M145.3 54.7 A64 64 0 1 0 145.3 145.3" fill="none" stroke="var(--text)" stroke-width="18" stroke-linecap="round"/><circle cx="92" cy="82" r="11" fill="var(--text)"/><circle cx="120" cy="100" r="11" fill="var(--text)"/><circle cx="92" cy="118" r="11" fill="var(--text)"/><circle cx="145.3" cy="54.7" r="16" fill="var(--mark)"/></svg>Collie iOS</h1>
  <p>Protótipo clicável · tokens de CollieTheme · use Claro/Escuro da Prévia</p>
  ${SCREENS.map(([g, items]) => `<h3>${g}</h3>${items.map(([id, l]) => `<button class="${currentPreset === id ? 'on' : ''}" data-preset="${id}">${l}</button>`).join('')}`).join('')}
  <div class="notes"><b>Dica:</b> tudo dentro do iPhone é clicável — abas, terminais, Aprovar/Negar, ⚡ e o campo de prompt.</div>`;
}
let toastTimer;
function render() {
  const fn = V[S.screen] || V.home;
  scr.innerHTML = fn() + sheet() + '<div class="toast" id="toast"></div><div class="home-ind"></div>';
  renderIndex();
  if (window.lucide) lucide.createIcons({ icons: lucide.icons });
}
function toast(msg) { const t = document.getElementById('toast'); t.innerHTML = `${I('check')} ${esc(msg)}`; if (window.lucide) lucide.createIcons({ icons: lucide.icons }); t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }
const STATUS_ANS = {
  'Onde estamos': t => t.id === 'net' ? '7/11 tarefas feitas. Em andamento: <b>Testes do NetworkPanel</b>. Aprovação pendente há 2 min.' : t.id === 'design' ? '3/6 feitas. Em andamento: <b>Desenhar telas e estados</b>. Adiada: Widget e Live Activity.' : 'Sem trabalho ativo. Último: revisão de feat/net-panel (2 achados).',
  'O que travou': t => t.id === 'net' ? 'Esperando sua aprovação de <span class="mono">swift test</span>. Job <span class="mono">swift build</span> sem sinal há 31 min.' : 'Nada travado.',
  'O que está rodando': t => t.id === 'net' ? '2 jobs: <span class="mono">mitmdump :8080</span> (rodando), <span class="mono">swift build</span> (sem sinal).' : t.id === 'design' ? '1 job: Prévia preview-5.' : 'Nada rodando.',
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-preset],[data-go],[data-tab],[data-term],[data-work],[data-prev],[data-ptheme],[data-ask],[data-act]');
  if (!el) return;
  const d = el.dataset;
  if (d.preset) { currentPreset = d.preset; Object.assign(S, { sheet: null }, PRESETS[d.preset]); return render(); }
  if (d.go) { S.sheet = null; if (d.go.startsWith('term-')) Object.assign(S, PRESETS[d.go]); else S.screen = d.go; return render(); }
  if (d.tab) { S.sheet = null; S.tab = d.tab; S.screen = { home: 'home', inbox: 'inbox', work: 'work', prev: 'previews' }[d.tab]; return render(); }
  if (d.term) { S.sheet = null; S.term = d.term; S.screen = 'term'; return render(); }
  if (d.work) { S.work = d.work; S.screen = 'work-detail'; return render(); }
  if (d.prev) { S.prev = d.prev; S.screen = 'preview'; return render(); }
  if (d.ptheme) { S.prevTheme = d.ptheme; return render(); }
  if (d.ask) { const t = allTerms.find(x => x.id === S.term); S.chat.push({ term: t.id, from: 'me', text: d.ask, meta: 'respondido pelo registro' }, { term: t.id, from: 'collie', text: STATUS_ANS[d.ask](t) }); render(); scr.querySelector('.body').scrollTop = 1e6; return; }
  const a = d.act;
  if (a === 'paired') { S.screen = 'home'; S.tab = 'home'; render(); return toast('Pareado com MacBook Pro'); }
  if (a.startsWith('toast:')) { S.sheet = null; render(); return toast(a.slice(6)); }
  if (a.startsWith('sheet:')) { S.sheet = a.slice(6) || null; return render(); }
  if (a.startsWith('decide:')) {
    const [, id, v] = a.split(':'); approvals = approvals.filter(x => x.id !== id); S.sheet = null;
    if (id === 'a1') { const t = allTerms.find(x => x.id === 'net'); t.status = v === 'ok' ? 'run' : 'idle'; t.line = v === 'ok' ? 'Rodando swift test…' : 'Negado · esperando instrução'; }
    if (id === 'a2') { const t = allTerms.find(x => x.id === 'cur'); t.status = v === 'ok' ? 'run' : 'idle'; t.line = v === 'ok' ? 'Reiniciado com acesso liberado' : 'Escrita negada'; }
    paddocks.forEach(p => p.terms.forEach(t => Object.assign(t, allTerms.find(x => x.id === t.id))));
    render(); return toast(v === 'ok' ? 'Aprovado · escrito no terminal' : v === 'ack' ? 'Ok, fica para você olhar' : 'Negado');
  }
  if (a === 'send') {
    const box = document.getElementById('askbox'), txt = box.value.trim(); if (!txt) return;
    const t = allTerms.find(x => x.id === S.term);
    S.chat.push({ term: t.id, from: 'me', text: txt, meta: 'na fila · entrega quando ficar 2 s calado' }); render(); scr.querySelector('.body').scrollTop = 1e6;
    setTimeout(() => { const m = S.chat.findLast(c => c.from === 'me' && c.term === t.id); m.meta = 'entregue'; S.chat.push({ term: t.id, from: 'agent', text: 'Entendido. Vou seguir com isso agora.' }); if (S.screen === 'term') { render(); scr.querySelector('.body').scrollTop = 1e6; } }, 1400);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'askbox') { e.preventDefault(); document.querySelector('[data-act="send"]').click(); } });
render();
if (!window.lucide) { const p = document.createElement('p'); p.style.cssText = 'text-align:center;color:var(--muted);font-size:12px'; p.textContent = 'Bibliotecas offline indisponíveis'; document.body.appendChild(p); }
</script>
