*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
/* derivados refeitos em cada [data-theme], senão um contêiner claro herda o resolvido da raiz escura */
:root, [data-theme] { --line: var(--color-border); --win: var(--color-bg); --panel: var(--color-surface); }
[data-theme="dark"] { --navy: #1E2647; --navy-2: #262E52; --mint: #7BD3A2; --danger: #FF8A80; --warn: #E8B04B; --ok: #7BD3A2; }
:root { --navy: #1E2647; --navy-2: #262E52; --mint: #7BD3A2; --danger: #FF8A80; --warn: #E8B04B; --ok: var(--mint); --line: var(--color-border); --win: var(--color-bg); --panel: var(--color-surface); }
[data-theme="light"] { --navy: #E3E8FF; --navy-2: #D3DBFF; --mint: #2F6F4F; --danger: #B3261E; --warn: #8A5A00; --ok: #1E7A4B; }

.btn.q { background: none; }

/* Android */

.cr { display: grid; grid-template-columns: 24px 1fr auto; gap: 4px 10px; padding: 10px 0; align-items: center; } .cr + .cr { border-top: 1px solid var(--line); }

.bar { grid-column: 2 / 4; height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--mint); border-radius: 6px; }
.bar i.run { background: repeating-linear-gradient(45deg, var(--mint) 0 8px, color-mix(in srgb, var(--mint) 65%, var(--bg)) 8px 16px); background-size: 22px 22px; animation: mv 1s linear infinite; } @keyframes mv { to { background-position: 22px 0; } }
.er { grid-column: 2 / 4; color: var(--danger); font-size: 12px; font-family: "DM Mono", monospace; }

.lic { background: var(--navy); border-radius: 12px; padding: 14px; margin-bottom: 14px; } .lic .box { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: "DM Mono", monospace; font-size: 12px; margin: 8px 0; } .lic .box div { padding: 2px 0; }

<script>
const $ = s => document.querySelector(s), esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = { page: 'android', android: 'nada', base: 'vazio', q: '', theme: 'auto', notes: true, gallery: false, avd: false, chk: false };
const STATES = [['nada','Nada instalado'],['parcial','Parcial (Studio)'],['preparando','Preparando (fase 1)'],['licenca','Precisa de licença'],['instalando','Instalando (fase 2)'],['pronto','Tudo pronto'],['erro','Erro'],['recusou','Recusou licenças'],['ocupado','Ocupado']];
/* ---------- seções de Aparência etc. (mesmos controles de hoje) ---------- */
const mini = (bg, ac, side) => `<div class="mini" style="background:${bg}">${side ? '<s></s>' : ''}<div><i style="background:${ac}"></i><u></u></div></div>`;
const card = (t, s, m, on) => `<button class="cc ${on ? 'on' : ''}" data-grp>${m}<b>${t}</b><span>${s}</span></button>`;

const SEC = {

SEC.android = () => android(S.android, S.base, true);
/* ---------- páginas da barra + nota do programador ---------- */
const NAV = [['Interface', ['aparencia', 'terminal']], ['Agentes', ['agentes', 'memoria', 'plugins']], ['Dispositivos', ['celular', 'android']]];
const PG = {

  android: ['Android', '▮', 'android java sdk emulador adb imagem licença licenças avd collie-lite platform-tools command-line cmdline', ['android'], [['Android', 'página <b>nova</b>: arquivo novo <code>AndroidPreferences.swift</code>, <code>AndroidPreferences(client:)</code>, no padrão de <code>CelularPreferences</code>. Dados de <code>android.status</code>, <code>android.licenses</code>, <code>android.install</code>, <code>device.lite.*</code>'], ['Fases', 'Preparar (JDK + cmdline-tools) começa no botão; Licenças só em <code>needsLicense</code> (some se todas <code>accepted</code>); Instalar só após o aceite. <code>busy</code> vira o estado Ocupado'], ['Novo caso', 'a lista de páginas (<code>["Aparência","Plug-ins","Celular"]</code>, :72) é substituída pelos 3 grupos acima']]],

const devNote = k => !S.notes ? '' : `<!-- SwiftUI: ${PG[k][4].map(x => x[0]).join(', ')} -->` + `<div class="dev"><b>SwiftUI · o que esta página substitui</b><ul>${PG[k][4].map(([a, b]) => `<li><b style="text-transform:none;letter-spacing:0;font-family:inherit;color:var(--text)">${a}:</b> ${b}</li>`).join('')}</ul></div>`;
